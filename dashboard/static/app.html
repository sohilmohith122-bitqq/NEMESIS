<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEMESIS Dashboard</title>
  <script src="/static/crypto.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0a0a0a;
      --surface: rgba(0,255,65,0.04);
      --border:  rgba(0,255,65,0.12);
      --accent:  #00ff41;
      --adim:    rgba(0,255,65,0.10);
      --text:    #00ff41;
      --muted:   #1a5a1a;
      --green:   #00ff41;
      --gdim:    rgba(0,255,65,0.12);
    }
    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: 'Courier New', 'Consolas', monospace;
      display: flex; flex-direction: column; overflow: hidden;
    }

    /* ── SCANLINE EFFECT ── */
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0.15),
        rgba(0,0,0,0.15) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 9999;
      opacity: 0.3;
    }

    /* ── GLOW EFFECTS ── */
    @keyframes text-glow {
      0%, 100% { text-shadow: 0 0 5px rgba(0,255,65,0.5), 0 0 10px rgba(0,255,65,0.3); }
      50% { text-shadow: 0 0 10px rgba(0,255,65,0.8), 0 0 20px rgba(0,255,65,0.5); }
    }

    .logo em {
      animation: text-glow 2s ease-in-out infinite;
    }

    /* ── HEADER ── */
    header {
      flex-shrink: 0; display: flex; align-items: center; gap: 10px;
      padding: 12px 16px; border-bottom: 1px solid rgba(0,255,65,0.15);
      background: rgba(10,10,10,0.95);
    }
    .logo { font-size: 15px; font-weight: 700; letter-spacing: 6px; text-transform: uppercase; }
    .logo em { color: var(--accent); font-style: normal; text-shadow: 0 0 10px rgba(0,255,65,0.5); }
    .pill {
      display: flex; align-items: center; gap: 6px; padding: 4px 11px;
      border-radius: 4px; background: rgba(0,255,65,0.05); border: 1px solid rgba(0,255,65,0.15);
      font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--muted); transition: all 0.3s; font-family: 'Courier New', monospace;
    }
    .pill.on { background: rgba(0,255,65,0.12); border-color: rgba(0,255,65,0.4); color: var(--green); box-shadow: 0 0 10px rgba(0,255,65,0.2); }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); transition: background 0.3s; }
    .pill.on .dot { background: var(--green); animation: blink 2s infinite; box-shadow: 0 0 8px rgba(0,255,65,0.6); }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .spacer { flex: 1; }
    .enc-badge {
      font-size: 9px; font-weight: 700; letter-spacing: 1.5px; padding: 3px 8px;
      border-radius: 4px; display: none; font-family: 'Courier New', monospace;
    }
    .enc-badge.on  { display: block; background: rgba(0,255,65,0.1); border: 1px solid rgba(0,255,65,0.3); color: var(--green); box-shadow: 0 0 8px rgba(0,255,65,0.2); }
    .enc-badge.off { display: block; background: rgba(255,0,64,0.08); border: 1px solid rgba(255,0,64,0.2); color: #ff0040; }
    .url { font-size: 10px; font-family: 'Courier New', monospace; color: var(--muted); padding: 4px 9px; background: rgba(0,255,65,0.03); border: 1px solid rgba(0,255,65,0.1); border-radius: 4px; }

    /* ── FEED ── */
    main { flex: 1; overflow-y: auto; padding: 14px 16px 8px; display: flex; flex-direction: column; gap: 10px; }
    main::-webkit-scrollbar { width: 3px; }
    main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.55; animation: pop 0.18s ease; }
    @keyframes pop { from { opacity:0; transform:translateY(4px); } }
    .msg-j   { align-self:flex-start; background:rgba(0,255,65,0.08);   border:1px solid rgba(0,255,65,0.2); border-bottom-left-radius:4px; font-family: 'Courier New', monospace; }
    .msg-u   { align-self:flex-end;   background:rgba(0,255,65,0.04); border:1px solid rgba(0,255,65,0.15); border-bottom-right-radius:4px; font-family: 'Courier New', monospace; }
    .msg-sys { align-self:center; font-size:11px; color:var(--muted); padding:2px 0; background:transparent; border:none; letter-spacing:0.3px; }
    .lbl { font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; opacity:0.45; margin-bottom:4px; }
    .msg-j .lbl { color:var(--accent); text-shadow: 0 0 8px rgba(0,255,65,0.4); }
    .msg-u .lbl { color:var(--muted); text-align:right; }

    /* ── FILE CARD ── */
    .msg-file {
      align-self: flex-end;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; border-bottom-right-radius: 4px;
      padding: 11px 14px; display: flex; align-items: center; gap: 12px;
      max-width: 82%; animation: pop 0.18s ease;
    }
    .fc-icon { font-size: 26px; flex-shrink: 0; }
    .fc-meta { flex: 1; min-width: 0; }
    .fc-lbl  { font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; opacity:0.45; color:var(--muted); margin-bottom:4px; }
    .fc-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fc-size { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .fc-bar-wrap { height: 3px; background: rgba(0,255,65,0.1); border-radius: 2px; margin-top: 7px; overflow: hidden; }
    .fc-bar { height: 100%; width: 0%; background: var(--accent); border-radius: 2px; transition: width 0.12s linear; box-shadow: 0 0 6px rgba(0,255,65,0.5); }
    .fc-status { font-size: 10px; font-weight: 700; letter-spacing: 1px; flex-shrink: 0; color: var(--muted); }
    .fc-status.done { color: var(--green); text-shadow: 0 0 8px rgba(0,255,65,0.5); }
    .fc-status.err  { color: #ff0040; }
    .fc-dl { display:block; margin-top:6px; font-size:11px; color:var(--accent); text-decoration:none; font-weight:600; font-family: 'Courier New', monospace; }
    .fc-dl:hover { opacity: 0.8; text-shadow: 0 0 8px rgba(0,255,65,0.5); }

    /* ── FOOTER ── */
    footer { flex-shrink:0; padding:10px 14px; border-top:1px solid rgba(0,255,65,0.15); background:rgba(10,10,10,0.95); display:flex; gap:8px; align-items:center; }
    #inp { flex:1; padding:11px 14px; background:rgba(0,255,65,0.05); border:1.5px solid rgba(0,255,65,0.2); border-radius:4px; color:var(--text); font-size:14px; font-family: 'Courier New', monospace; outline:none; transition:border-color 0.15s; }
    #inp:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(0,255,65,0.3); }
    #inp::placeholder { color: var(--muted); }
    .btn { padding:11px 15px; border:none; border-radius:4px; font-size:11px; font-weight:700; letter-spacing:1.5px; font-family: 'Courier New', monospace; cursor:pointer; transition:opacity 0.15s,transform 0.1s; text-transform: uppercase; }
    .btn:active { transform: scale(0.96); }
    .btn:hover  { opacity: 0.82; }
    .btn-send { background: var(--accent); color: #000; text-shadow: none; box-shadow: 0 0 15px rgba(0,255,65,0.4); }
    .btn-wake { background:rgba(0,255,65,0.05); border:1px solid rgba(0,255,65,0.2); color:var(--muted); display:none; }
    .btn-wake.show { display:block; color:var(--green); border-color:rgba(0,255,65,0.4); box-shadow: 0 0 10px rgba(0,255,65,0.3); }
    .btn-attach {
      background: rgba(0,255,65,0.05); border: 1px solid rgba(0,255,65,0.2); color: var(--muted);
      padding: 11px 13px; font-size: 16px; line-height: 1; border-radius: 4px;
      cursor: pointer; transition: opacity 0.15s, transform 0.1s; display: flex;
      align-items: center; justify-content: center; flex-shrink: 0;
    }
    .btn-attach:hover  { opacity: 0.82; border-color: var(--accent); color: var(--accent); box-shadow: 0 0 10px rgba(0,255,65,0.3); }
    .btn-attach:active { transform: scale(0.96); }

    /* ── MIC BUTTON ── */
    #mic-btn {
      background: rgba(0,255,65,0.05); border: 1px solid rgba(0,255,65,0.2); color: var(--muted);
      padding: 11px 13px; font-size: 16px; line-height: 1; border-radius: 4px;
      cursor: pointer; transition: opacity 0.15s, transform 0.1s, background 0.2s, border-color 0.2s;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    #mic-btn:hover  { opacity: 0.82; border-color: var(--accent); color: var(--accent); box-shadow: 0 0 10px rgba(0,255,65,0.3); }
    #mic-btn:active { transform: scale(0.96); }
    #mic-btn.recording {
      background: rgba(0,255,65,0.15); border-color: rgba(0,255,65,0.5); color: #00ff41;
      animation: mic-pulse 1s ease-in-out infinite;
    }
    #mic-btn.unsupported { opacity: 0.3; cursor: not-allowed; }
    @keyframes mic-pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.65;transform:scale(0.97);box-shadow:0 0 15px rgba(0,255,65,0.6)} }

    /* ── TOAST ── */
    #toast {
      position:fixed; top:66px; left:50%; transform:translateX(-50%) translateY(-8px);
      background:rgba(0,255,65,0.16); border:1px solid rgba(0,255,65,0.5);
      color:var(--green); font-size:12px; font-weight:700; letter-spacing:1px;
      padding:7px 18px; border-radius:4px;
      opacity:0; transition:opacity 0.22s,transform 0.22s;
      pointer-events:none; white-space:nowrap;
      box-shadow: 0 0 20px rgba(0,255,65,0.3);
      font-family: 'Courier New', monospace;
    }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    /* ═══════════════════════════════════════════════════════════════════════
       ARC REACTOR STARTUP OVERLAY
       ═══════════════════════════════════════════════════════════════════════ */
    #arc-overlay {
      position: fixed; inset: 0; z-index: 10000;
      background: #000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      transition: opacity 1.2s ease-out;
    }
    #arc-overlay.fade-out { opacity: 0; pointer-events: none; }

    /* Arc Reactor SVG container */
    .arc-reactor {
      width: 220px; height: 220px; position: relative;
    }
    .arc-reactor svg { width: 100%; height: 100%; }

    /* Ring rotation animations */
    .arc-ring-outer {
      animation: arc-spin-outer 8s linear infinite;
      transform-origin: center;
    }
    .arc-ring-inner {
      animation: arc-spin-inner 5s linear infinite;
      transform-origin: center;
    }
    .arc-core {
      animation: arc-pulse 1.5s ease-in-out infinite;
      transform-origin: center;
    }
    .arc-rays {
      animation: arc-spin-rays 12s linear infinite;
      transform-origin: center;
    }

    @keyframes arc-spin-outer {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes arc-spin-inner {
      from { transform: rotate(0deg); }
      to   { transform: rotate(-360deg); }
    }
    @keyframes arc-pulse {
      0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 8px rgba(0,180,255,0.6)); }
      50%      { opacity: 1;   filter: drop-shadow(0 0 25px rgba(0,180,255,1)); }
    }
    @keyframes arc-spin-rays {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* Power-up glow ring */
    .arc-glow {
      position: absolute; inset: -30px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,180,255,0.15) 0%, transparent 70%);
      animation: arc-glow-expand 2s ease-out forwards;
    }
    @keyframes arc-glow-expand {
      from { transform: scale(0.3); opacity: 0; }
      to   { transform: scale(1.5); opacity: 1; }
    }

    /* Startup text sequence */
    .arc-text {
      margin-top: 30px; text-align: center;
      font-family: 'Courier New', monospace;
      color: #00b4ff;
    }
    .arc-title {
      font-size: 22px; font-weight: 700; letter-spacing: 10px;
      text-transform: uppercase;
      text-shadow: 0 0 15px rgba(0,180,255,0.6), 0 0 30px rgba(0,180,255,0.3);
      opacity: 0; animation: arc-text-in 0.6s ease-out 1.2s forwards;
    }
    .arc-subtitle {
      font-size: 11px; letter-spacing: 4px; margin-top: 8px;
      color: rgba(0,180,255,0.5);
      opacity: 0; animation: arc-text-in 0.5s ease-out 2s forwards;
    }
    .arc-status {
      font-size: 10px; letter-spacing: 3px; margin-top: 16px;
      color: #00ff41;
      opacity: 0; animation: arc-text-in 0.4s ease-out 2.8s forwards;
    }
    .arc-status .cursor {
      animation: blink-cursor 0.8s step-end infinite;
    }
    @keyframes arc-text-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes blink-cursor {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0; }
    }

    /* Scan lines sweeping up */
    .arc-scanline {
      position: absolute; width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, rgba(0,180,255,0.5), transparent);
      animation: arc-scan 2s ease-in-out 0.5s infinite;
    }
    @keyframes arc-scan {
      0%   { top: 0%; opacity: 0; }
      20%  { opacity: 1; }
      80%  { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    /* ═══════════════════════════════════════════════════════════════════════
       IRON MAN HUD OVERLAY — wireframe helmet HUD style
       ═══════════════════════════════════════════════════════════════════════ */
    #hud-overlay {
      position: fixed; inset: 0; z-index: 9998;
      pointer-events: none;
      overflow: hidden;
    }

    /* ── Corner brackets ── */
    .hud-corner {
      position: absolute;
      width: 60px; height: 60px;
      border-color: rgba(0,200,255,0.25);
      border-style: solid;
    }
    .hud-corner.tl { top: 12px; left: 12px; border-width: 2px 0 0 2px; }
    .hud-corner.tr { top: 12px; right: 12px; border-width: 2px 2px 0 0; }
    .hud-corner.bl { bottom: 12px; left: 12px; border-width: 0 0 2px 2px; }
    .hud-corner.br { bottom: 12px; right: 12px; border-width: 0 2px 2px 0; }
    .hud-corner::after {
      content: '';
      position: absolute;
      width: 8px; height: 8px;
      border-color: rgba(0,200,255,0.5);
      border-style: solid;
    }
    .hud-corner.tl::after { top: -2px; left: -2px; border-width: 1px 0 0 1px; }
    .hud-corner.tr::after { top: -2px; right: -2px; border-width: 1px 1px 0 0; }
    .hud-corner.bl::after { bottom: -2px; left: -2px; border-width: 0 0 1px 1px; }
    .hud-corner.br::after { bottom: -2px; right: -2px; border-width: 0 1px 1px 0; }

    /* ── Scanning beam ── */
    .hud-scan-beam {
      position: absolute; left: 0; width: 100%; height: 1px;
      background: linear-gradient(90deg, transparent 0%, rgba(0,200,255,0.3) 20%, rgba(0,200,255,0.6) 50%, rgba(0,200,255,0.3) 80%, transparent 100%);
      box-shadow: 0 0 8px rgba(0,200,255,0.4), 0 0 20px rgba(0,200,255,0.15);
      animation: hud-scan-down 4s linear infinite;
    }
    @keyframes hud-scan-down {
      0%   { top: -2%; opacity: 0; }
      5%   { opacity: 1; }
      95%  { opacity: 1; }
      100% { top: 102%; opacity: 0; }
    }

    /* ── Center targeting reticle ── */
    .hud-reticle {
      position: absolute;
      top: 50%; left: 50%;
      width: 120px; height: 120px;
      transform: translate(-50%, -50%);
      opacity: 0.15;
    }
    .hud-reticle svg { width: 100%; height: 100%; }
    .hud-reticle-outer { animation: hud-ret-spin 20s linear infinite; transform-origin: center; }
    .hud-reticle-inner { animation: hud-ret-spin 14s linear infinite reverse; transform-origin: center; }
    @keyframes hud-ret-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* ── Hexagon grid (subtle) ── */
    .hud-hex-grid {
      position: absolute; inset: 0;
      opacity: 0.03;
      background-image:
        linear-gradient(30deg, rgba(0,200,255,0.3) 12%, transparent 12.5%, transparent 87%, rgba(0,200,255,0.3) 87.5%, rgba(0,200,255,0.3)),
        linear-gradient(150deg, rgba(0,200,255,0.3) 12%, transparent 12.5%, transparent 87%, rgba(0,200,255,0.3) 87.5%, rgba(0,200,255,0.3)),
        linear-gradient(30deg, rgba(0,200,255,0.3) 12%, transparent 12.5%, transparent 87%, rgba(0,200,255,0.3) 87.5%, rgba(0,200,255,0.3)),
        linear-gradient(150deg, rgba(0,200,255,0.3) 12%, transparent 12.5%, transparent 87%, rgba(0,200,255,0.3) 87.5%, rgba(0,200,255,0.3)),
        linear-gradient(60deg, rgba(0,200,255,0.2) 25%, transparent 25.5%, transparent 75%, rgba(0,200,255,0.2) 75%, rgba(0,200,255,0.2)),
        linear-gradient(60deg, rgba(0,200,255,0.2) 25%, transparent 25.5%, transparent 75%, rgba(0,200,255,0.2) 75%, rgba(0,200,255,0.2));
      background-size: 80px 140px;
      background-position: 0 0, 0 0, 40px 70px, 40px 70px, 0 0, 40px 70px;
    }

    /* ── Left data readout panel ── */
    .hud-data-left {
      position: absolute; left: 20px; top: 50%;
      transform: translateY(-50%);
      font-size: 9px; color: rgba(0,200,255,0.35);
      letter-spacing: 2px; line-height: 1.8;
      text-transform: uppercase;
      font-family: 'Courier New', monospace;
    }
    .hud-data-left .hud-label {
      color: rgba(0,200,255,0.5);
      font-weight: 700;
      margin-bottom: 2px;
    }
    .hud-data-left .hud-value {
      animation: hud-flicker 3s ease-in-out infinite;
    }
    @keyframes hud-flicker {
      0%, 100% { opacity: 0.35; }
      50%      { opacity: 0.55; }
    }

    /* ── Right status indicators ── */
    .hud-data-right {
      position: absolute; right: 20px; top: 50%;
      transform: translateY(-50%);
      font-size: 9px; color: rgba(0,200,255,0.35);
      letter-spacing: 2px; line-height: 1.8;
      text-transform: uppercase;
      font-family: 'Courier New', monospace;
      text-align: right;
    }
    .hud-data-right .hud-label {
      color: rgba(0,200,255,0.5);
      font-weight: 700;
    }

    /* ── Top bar data strip ── */
    .hud-top-strip {
      position: absolute; top: 14px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 24px;
      font-size: 8px; letter-spacing: 2px;
      color: rgba(0,200,255,0.3);
      font-family: 'Courier New', monospace;
      text-transform: uppercase;
    }
    .hud-top-strip .hud-sep { color: rgba(0,200,255,0.15); }

    /* ── Bottom bar ── */
    .hud-bottom-strip {
      position: absolute; bottom: 14px; left: 50%;
      transform: translateX(-50%);
      font-size: 8px; letter-spacing: 3px;
      color: rgba(0,200,255,0.25);
      font-family: 'Courier New', monospace;
    }

    /* ── Circular equalizer bars (left side) ── */
    .hud-eq {
      position: absolute; left: 24px; bottom: 30px;
      display: flex; gap: 3px; align-items: flex-end;
    }
    .hud-eq-bar {
      width: 2px;
      background: rgba(0,200,255,0.3);
      animation: eq-bounce var(--d, 0.8s) ease-in-out infinite alternate;
    }
    @keyframes eq-bounce { 0% { height: 4px; } 100% { height: var(--h, 18px); } }

    /* ── Rotating compass (right side) ── */
    .hud-compass {
      position: absolute; right: 24px; bottom: 30px;
      width: 40px; height: 40px; opacity: 0.2;
      animation: hud-ret-spin 10s linear infinite;
    }
    .hud-compass svg { width: 100%; height: 100%; }

    /* ── Crosshair center ── */
    .hud-crosshair {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 40px; height: 40px;
      opacity: 0.12;
    }
    .hud-crosshair::before,
    .hud-crosshair::after {
      content: '';
      position: absolute;
      background: rgba(0,200,255,0.5);
    }
    .hud-crosshair::before {
      width: 1px; height: 100%; left: 50%; transform: translateX(-50%);
    }
    .hud-crosshair::after {
      width: 100%; height: 1px; top: 50%; transform: translateY(-50%);
    }

    /* ── Vertical line accents ── */
    .hud-vline {
      position: absolute; width: 1px;
      background: linear-gradient(180deg, transparent, rgba(0,200,255,0.15), transparent);
    }
    .hud-vline.left  { left: 90px; top: 0; height: 100%; }
    .hud-vline.right { right: 90px; top: 0; height: 100%; }

    /* ── Horizontal line accents ── */
    .hud-hline {
      position: absolute; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0,200,255,0.1), transparent);
    }
    .hud-hline.top    { top: 80px; left: 0; width: 100%; }
    .hud-hline.bottom { bottom: 80px; left: 0; width: 100%; }

    /* ── Breathing glow corners ── */
    .hud-glow-tl {
      position: absolute; top: 0; left: 0;
      width: 200px; height: 200px;
      background: radial-gradient(ellipse at 0% 0%, rgba(0,200,255,0.04) 0%, transparent 70%);
      animation: hud-glow-pulse 5s ease-in-out infinite;

    .hud-glow-br {
      position: absolute; bottom: 0; right: 0;

      background: radial-gradient(ellipse at 100% 100%, rgba(0,200,255,0.04) 0%, transparent 70%);
      animation: hud-glow-pulse 5s ease-in-out infinite 2.5s;
    }
    @keyframes hud-glow-pulse {
      0%, 100% { opacity: 0.5; }
      50%      { opacity: 1; }
    }
  </style>
</head>

    <div class="arc-text">

  <div id="toast"></div>
  <header>
    <div class="logo"><em>J</em>ARVIS</div>
    <div class="pill" id="pill"><span class="dot"></span><span id="st">Connecting</span></div>
    <div class="enc-badge" id="enc">AES-256</div>
    <div class="spacer"></div>
    <div class="url">__IP__:__PORT__</div>
  </header>
  <main id="feed"></main>
  <footer>
    <input id="inp" placeholder="Send a command to NEMESIS…" autocomplete="off">
    <label class="btn-attach" for="file-inp" title="Send file">📎</label>
    <input type="file" id="file-inp" multiple accept="*/*" style="display:none">
    <button id="mic-btn" onclick="doMic()" title="Voice command">🎤</button>
    <button class="btn btn-wake" id="wake" onclick="doWake()">WAKE</button>
    <button class="btn btn-send" onclick="doSend()">SEND</button>
  </footer>

  <script>
    // ── Auth — bearer token ───────────────────────────────────────────────────
    const _authToken  = sessionStorage.getItem('nemesis_token');
    const _sessionKey = sessionStorage.getItem('nemesis_key');

    if (!_authToken) {
      location.replace('/login');
    }

    function _authHeader() { return { 'Authorization': `Bearer ${_authToken}` }; }
    function _authFetch(url, opts = {}) {
      opts.headers = Object.assign({}, opts.headers, _authHeader());
      return fetch(url, opts);
    }

    // ── AES-256-CBC encryption (CryptoJS) ────────────────────────────────────
    const _AES_SALT = 'NEMESIS-DASHBOARD-v1';
    let _aesKey = null;

    function _initCrypto(key) {
      if (typeof CryptoJS === 'undefined') return false;
      _aesKey = CryptoJS.SHA256(key + _AES_SALT);
      return true;
    }

    function _encrypt(plaintext) {
      if (!_aesKey || typeof CryptoJS === 'undefined') return null;
      try {
        const iv  = CryptoJS.lib.WordArray.random(16);
        const enc = CryptoJS.AES.encrypt(
          CryptoJS.enc.Utf8.parse(plaintext), _aesKey,
          { iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
        );
        const ivHex = iv.toString(CryptoJS.enc.Hex);
        const ctHex = enc.ciphertext.toString(CryptoJS.enc.Hex);
        const hex   = ivHex + ctHex;
        const bytes = new Uint8Array(hex.length / 2);
        for (let i = 0; i < bytes.length; i++)
          bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
        return btoa(String.fromCharCode(...bytes));
      } catch { return null; }
    }

    const _encReady = _sessionKey ? _initCrypto(_sessionKey) : false;
    const encBadge  = document.getElementById('enc');
    if (_encReady) { encBadge.className = 'enc-badge on'; }
    else           { encBadge.className = 'enc-badge off'; encBadge.textContent = 'NO ENC'; }

    // ── WebSocket ─────────────────────────────────────────────────────────────
    const feed  = document.getElementById('feed');
    const pill  = document.getElementById('pill');
    const stTxt = document.getElementById('st');
    const wake  = document.getElementById('wake');

    const _wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
    const _wsUrl   = `${_wsProto}://${location.host}/ws?token=${encodeURIComponent(_authToken)}`;
    const ws       = new WebSocket(_wsUrl);

    ws.onopen    = () => { sys('Remote session active.'); toast('Connected to NEMESIS'); };
    ws.onclose   = () => sys('Connection lost — refresh to reconnect.');
    ws.onerror   = () => sys('Connection error.');
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === 'log')           append(m.speaker, m.text);
      if (m.type === 'status')        setStatus(m.state);
      if (m.type === 'wake')          sys('Wake word detected — connecting…');
      if (m.type === 'sys')           sys(m.text);
      if (m.type === 'file_received') _onFileReceived(m);
    };

    function setStatus(s) {
      if (s === 'active') {
        pill.className = 'pill on'; stTxt.textContent = 'Active'; wake.classList.remove('show');
      } else {
        pill.className = 'pill'; stTxt.textContent = 'Sleeping'; wake.classList.add('show');
      }
    }

    function append(speaker, text) {
      const d = document.createElement('div');
      if (speaker === 'nemesis') {
        d.className = 'msg msg-j';
        d.innerHTML = `<div class="lbl">Nemesis</div>${esc(text)}`;
      } else {
        d.className = 'msg msg-u';
        d.innerHTML = `<div class="lbl">You</div>${esc(text)}`;
      }
      feed.appendChild(d);
      feed.scrollTop = feed.scrollHeight;
    }

    function sys(text) {
      const d = document.createElement('div');
      d.className = 'msg msg-sys'; d.textContent = text;
      feed.appendChild(d); feed.scrollTop = feed.scrollHeight;
    }

    function esc(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ── File helpers ──────────────────────────────────────────────────────────
    function _fileIcon(name) {
      const ext = (name.split('.').pop() || '').toLowerCase();
      if (['jpg','jpeg','png','gif','webp','heic','heif','avif','bmp','svg'].includes(ext)) return '🖼️';
      if (['mp4','mov','avi','mkv','webm','m4v','3gp'].includes(ext))                       return '🎬';
      if (['mp3','m4a','wav','flac','aac','ogg','opus'].includes(ext))                      return '🎵';
      if (['pdf'].includes(ext))                                                             return '📋';
      if (['doc','docx','txt','md','rtf','odt'].includes(ext))                              return '📝';
      if (['xls','xlsx','csv','ods'].includes(ext))                                         return '📊';
      if (['ppt','pptx','odp'].includes(ext))                                               return '📑';
      if (['zip','rar','7z','tar','gz','bz2','xz'].includes(ext))                          return '📦';
      if (['apk','exe','dmg','deb','rpm','msi'].includes(ext))                              return '⚙️';
      return '📎';
    }

    function _fmtSize(bytes) {
      if (bytes < 1024)             return bytes + ' B';
      if (bytes < 1024 * 1024)     return (bytes / 1024).toFixed(1) + ' KB';
      if (bytes < 1024 ** 3)       return (bytes / 1024 / 1024).toFixed(1) + ' MB';
      return (bytes / 1024 ** 3).toFixed(2) + ' GB';
    }

    // ── File upload (phone → computer) ────────────────────────────────────────
    function _uploadFile(file) {
      const id = 'fc_' + Date.now() + '_' + Math.random().toString(36).slice(2);

      // Create file card in feed
      const card = document.createElement('div');
      card.className = 'msg-file';
      card.id = id;
      card.innerHTML = `
        <div class="fc-icon">${_fileIcon(file.name)}</div>
        <div class="fc-meta">
          <div class="fc-lbl">Sending</div>
          <div class="fc-name">${esc(file.name)}</div>
          <div class="fc-size">${_fmtSize(file.size)}</div>
          <div class="fc-bar-wrap"><div class="fc-bar" id="${id}_bar"></div></div>
        </div>
        <div class="fc-status" id="${id}_st">0%</div>
      `;
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload');
      xhr.setRequestHeader('Authorization', `Bearer ${_authToken}`);

      xhr.upload.onprogress = (e) => {
        if (!e.lengthComputable) return;
        const pct = Math.round(e.loaded / e.total * 100);
        const bar = document.getElementById(`${id}_bar`);
        const st  = document.getElementById(`${id}_st`);
        if (bar) bar.style.width = pct + '%';
        if (st)  st.textContent  = pct + '%';
      };

      xhr.onload = () => {
        const bar  = document.getElementById(`${id}_bar`);
        const st   = document.getElementById(`${id}_st`);
        const meta = card.querySelector('.fc-meta');
        const lbl  = card.querySelector('.fc-lbl');
        if (xhr.status === 200) {
          let savedName = file.name;
          try { savedName = JSON.parse(xhr.responseText).name || file.name; } catch {}
          const dlUrl = `/uploads/${encodeURIComponent(savedName)}?token=${encodeURIComponent(_authToken)}`;
          if (bar)  { bar.style.width = '100%'; bar.style.background = 'var(--green)'; }
          if (st)   { st.textContent = '✓'; st.className = 'fc-status done'; }
          if (lbl)  lbl.textContent = 'Sent';
          if (meta) meta.insertAdjacentHTML('beforeend',
            `<a class="fc-dl" href="${dlUrl}" download="${esc(savedName)}">⬇ Download back</a>`);
          toast('File sent!');
        } else {
          let errMsg = 'Upload failed';
          try { errMsg = JSON.parse(xhr.responseText).error || errMsg; } catch {}
          if (bar) bar.style.background = '#f87171';
          if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
          if (lbl) lbl.textContent = errMsg;
        }
      };

      xhr.onerror = () => {
        const st  = document.getElementById(`${id}_st`);
        const lbl = card.querySelector('.fc-lbl');
        if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
        if (lbl) lbl.textContent = 'Connection error';
      };

      const fd = new FormData();
      fd.append('file', file);
      xhr.send(fd);
    }

    // File received by another WebSocket client (e.g., second open tab)
    function _onFileReceived(m) {
      const dlUrl = `/uploads/${encodeURIComponent(m.name)}?token=${encodeURIComponent(_authToken)}`;
      const card  = document.createElement('div');
      card.className = 'msg-file';
      card.innerHTML = `
        <div class="fc-icon">${_fileIcon(m.name)}</div>
        <div class="fc-meta">
          <div class="fc-lbl">Received</div>
          <div class="fc-name">${esc(m.name)}</div>
          <div class="fc-size">${_fmtSize(m.size)}</div>
          <a class="fc-dl" href="${dlUrl}" download="${esc(m.name)}">⬇ Download</a>
        </div>
        <div class="fc-status done">✓</div>
      `;
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;
      toast('File received on computer!');
    }

    // File input change handler
    document.getElementById('file-inp').addEventListener('change', function () {
      Array.from(this.files).forEach(_uploadFile);
      this.value = ''; // reset so the same file can be re-sent
    });

    // ── Commands ──────────────────────────────────────────────────────────────
    function doSend() {
      const inp = document.getElementById('inp');
      const txt = inp.value.trim();
      if (!txt) return;
      inp.value = '';
      append('user', txt);
      const enc  = _encrypt(txt);
      const body = enc ? { enc } : { text: txt };
      _authFetch('/api/command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
    }

    function doWake() {
      sys('Sending wake signal…');
      _authFetch('/api/wake', { method: 'POST' });
    }

    document.getElementById('inp').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
    });

    // ── Toast ─────────────────────────────────────────────────────────────────
    let _toastTimer;
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
    }

    // ── Real-time Voice — PCM16 WebSocket → Gemini Live ──────────────────────
    const micBtn  = document.getElementById('mic-btn');
    let _voiceWs  = null;
    let _audioCtx = null;
    let _micStm   = null;
    let _audioNd  = null;

    function _micIdle() {
      micBtn.innerHTML = '🎤';
      micBtn.title     = 'Voice — tap to speak';
      micBtn.classList.remove('recording');
    }

    // Float32 PCM → resample to 16 kHz + convert to Int16
    function _f32toPcm16(f32, srcRate) {
      let s = f32;
      if (srcRate !== 16000) {
        const ratio = srcRate / 16000;
        const len   = Math.round(f32.length / ratio);
        s = new Float32Array(len);
        for (let i = 0; i < len; i++)
          s[i] = f32[Math.min(Math.round(i * ratio), f32.length - 1)];
      }
      const out = new Int16Array(s.length);
      for (let i = 0; i < s.length; i++)
        out[i] = Math.max(-32768, Math.min(32767, Math.round(s[i] * 32768)));
      return out.buffer;
    }

    function _showVoiceSetup() {
      if (document.getElementById('voice-setup')) return; // show once
      const origin = location.origin;
      const card = document.createElement('div');
      card.id = 'voice-setup';
      card.style.cssText = [
        'align-self:stretch', 'background:rgba(99,102,241,0.07)',
        'border:1px solid rgba(99,102,241,0.22)', 'border-radius:14px',
        'padding:16px 18px', 'font-size:13px', 'line-height:1.8',
        'animation:pop 0.18s ease'
      ].join(';');
      card.innerHTML =
        '<div style="font-weight:700;color:#818cf8;letter-spacing:.5px;margin-bottom:10px">🎤 One-time voice setup</div>' +
        '<ol style="padding-left:18px;color:#8899aa;margin:0;display:flex;flex-direction:column;gap:4px">' +
        '<li>Open a new tab → go to <span style="background:rgba(255,255,255,0.07);padding:1px 6px;border-radius:4px;font-family:monospace;font-size:12px">chrome://flags</span></li>' +
        '<li>Search: <strong style="color:#dde3ed">Insecure origins treated as secure</strong></li>' +
        '<li>Paste this URL into the box:<br><span id="flags-url" style="background:rgba(255,255,255,0.07);padding:2px 8px;border-radius:4px;font-family:monospace;font-size:11px;user-select:all;cursor:pointer">' + esc(origin) + '</span></li>' +
        '<li>Set to <strong style="color:#22c55e">Enabled</strong> → tap <strong style="color:#dde3ed">Relaunch</strong></li>' +
        '<li>Return here and tap 🎤</li>' +
        '</ol>';
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;
      // tap to copy
      card.querySelector('#flags-url').addEventListener('click', () => {
        navigator.clipboard?.writeText(origin).then(() => toast('URL copied!')).catch(() => {});
      });
    }

    async function doMic() {
      if (_voiceWs) { _stopVoice(); return; }

      if (!navigator.mediaDevices?.getUserMedia) {
        _showVoiceSetup();
        return;
      }
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
        });
      } catch (e) {
        sys(e.name === 'NotAllowedError'
          ? 'Microphone denied — tap the address bar lock and allow microphone.'
          : 'Mic error: ' + e.message);
        return;
      }

      // 16 kHz context (fall back to native rate — _f32toPcm16 resamples)
      let ctx;
      try { ctx = new AudioContext({ sampleRate: 16000 }); }
      catch (_) { ctx = new AudioContext(); }
      if (ctx.state === 'suspended') await ctx.resume();

      const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(
        `${wsProto}://${location.host}/ws/phone-audio?token=${encodeURIComponent(_authToken)}`
      );
      ws.binaryType = 'arraybuffer';

      ws.onopen = async () => {
        const rate = ctx.sampleRate;
        const src  = ctx.createMediaStreamSource(stream);

        // AudioWorklet (modern) — runs in dedicated audio thread
        const wCode = `class J extends AudioWorkletProcessor{process(i){const c=i[0]?.[0];if(c)this.port.postMessage(c.slice());return true;}}registerProcessor('j',J);`;
        try {
          const burl = URL.createObjectURL(new Blob([wCode], { type: 'application/javascript' }));
          await ctx.audioWorklet.addModule(burl);
          URL.revokeObjectURL(burl);
          const nd = new AudioWorkletNode(ctx, 'j');
          // Buffer to 1024 samples (64 ms at 16 kHz) before sending —
          // matches PC mic chunk size, prevents queue flooding on the server.
          let _pbuf = [], _plen = 0;
          nd.port.onmessage = e => {
            const chunk = new Int16Array(_f32toPcm16(e.data, rate));
            _pbuf.push(chunk); _plen += chunk.length;
            if (_plen >= 1024) {
              const out = new Int16Array(_plen); let off = 0;
              for (const c of _pbuf) { out.set(c, off); off += c.length; }
              if (ws.readyState === 1) ws.send(out.buffer);
              _pbuf = []; _plen = 0;
            }
          };
          src.connect(nd);
          _audioNd = nd;
        } catch (_) {
          // ScriptProcessor fallback (deprecated, still works everywhere)
          const sp = ctx.createScriptProcessor(4096, 1, 1);
          sp.onaudioprocess = e => {
            if (ws.readyState === 1) ws.send(_f32toPcm16(e.inputBuffer.getChannelData(0), rate));
          };
          src.connect(sp); sp.connect(ctx.destination);
          _audioNd = sp;
        }

        micBtn.innerHTML = '⏹';
        micBtn.title     = 'Tap to stop';
        micBtn.classList.add('recording');
        sys('Voice live — speak now');
        toast('🎤 Live');
      };

      ws.onclose = () => { _stopVoice(); };
      ws.onerror = () => { sys('Voice connection failed.'); _stopVoice(); };

      _voiceWs  = ws;
      _audioCtx = ctx;
      _micStm   = stream;
    }

    function _stopVoice() {
      if (_audioNd)  { try { _audioNd.disconnect(); }  catch (_) {}; _audioNd  = null; }
      if (_audioCtx) { try { _audioCtx.close(); }      catch (_) {}; _audioCtx = null; }
      if (_micStm)   { _micStm.getTracks().forEach(t => t.stop()); _micStm = null; }
      if (_voiceWs)  {
        const w = _voiceWs; _voiceWs = null;
        if (w.readyState < 2) w.close();
      }
      _micIdle();
    }
  </script>

  <!-- Matrix Rain Effect -->
  <canvas id="matrix" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;opacity:0.08;pointer-events:none;"></canvas>
  <script>
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()_+-=[]{}|;:,.<>?';
    const fontSize = 14;
    const columns = Math.floor(canvas.width / fontSize);
    const drops = Array(columns).fill(1);
    function drawMatrix() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00ff41';
      ctx.font = fontSize + 'px Courier New';
      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 50);
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    // ── IRON MAN HUD — live data updates ────────────────────────────────────
    (function hudUpdater() {
      const startTime = Date.now();

      function pad(n) { return String(n).padStart(2, '0'); }

      function update() {
        // Date & time
        const now = new Date();
        const dateEl = document.getElementById('hud-date');
        const timeEl = document.getElementById('hud-time');
        if (dateEl) dateEl.textContent = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }).toUpperCase();
        if (timeEl) timeEl.textContent = now.toLocaleTimeString('en-US', { hour12: false });

        // Uptime
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const h = Math.floor(elapsed / 3600);
        const m = Math.floor((elapsed % 3600) / 60);
        const s = elapsed % 60;
        const uptimeEl = document.getElementById('hud-uptime');
        if (uptimeEl) uptimeEl.textContent = pad(h) + ':' + pad(m) + ':' + pad(s);

        // CPU / Memory (if available via performance API)
        const cpuEl = document.getElementById('hud-cpu');
        const memEl = document.getElementById('hud-mem');
        if (cpuEl && performance) {
          const entries = performance.getEntriesByType('resource');
          const load = Math.min(99, 10 + entries.length * 0.5 + Math.random() * 5);
          cpuEl.textContent = load.toFixed(1);
        }
        if (memEl && performance.memory) {
          const used = performance.memory.usedJSHeapSize / performance.memory.totalJSHeapSize * 100;
          memEl.textContent = used.toFixed(1) + '%';
        }
      }

      update();
      setInterval(update, 1000);
    })();

    // ── ARC REACTOR STARTUP ANIMATION ──────────────────────────────────────
    (function arcReactorStartup() {
      const overlay = document.getElementById('arc-overlay');
      if (!overlay) return;

      // ── Synthesize arc-reactor power-up sound via Web Audio API ─────────
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        const ctx = new AC();

        // Layer 1: Deep rising hum (reactor powering up)
        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(60, ctx.currentTime);
        osc1.frequency.exponentialRampToValueAtTime(220, ctx.currentTime + 2.5);
        gain1.gain.setValueAtTime(0, ctx.currentTime);
        gain1.gain.linearRampToValueAtTime(0.18, ctx.currentTime + 0.5);
        gain1.gain.linearRampToValueAtTime(0.08, ctx.currentTime + 2.5);
        gain1.gain.linearRampToValueAtTime(0, ctx.currentTime + 3.5);
        osc1.connect(gain1).connect(ctx.destination);
        osc1.start(ctx.currentTime);
        osc1.stop(ctx.currentTime + 3.5);

        // Layer 2: High shimmer (energy ring activation)
        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(800, ctx.currentTime + 0.8);
        osc2.frequency.exponentialRampToValueAtTime(1800, ctx.currentTime + 2.0);
        gain2.gain.setValueAtTime(0, ctx.currentTime + 0.8);
        gain2.gain.linearRampToValueAtTime(0.06, ctx.currentTime + 1.2);
        gain2.gain.linearRampToValueAtTime(0, ctx.currentTime + 2.8);
        osc2.connect(gain2).connect(ctx.destination);
        osc2.start(ctx.currentTime + 0.8);
        osc2.stop(ctx.currentTime + 3.0);

        // Layer 3: Core ignition pop
        const osc3 = ctx.createOscillator();
        const gain3 = ctx.createGain();
        osc3.type = 'sine';
        osc3.frequency.setValueAtTime(440, ctx.currentTime + 1.8);
        osc3.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 2.2);
        gain3.gain.setValueAtTime(0, ctx.currentTime + 1.8);
        gain3.gain.linearRampToValueAtTime(0.12, ctx.currentTime + 2.0);
        gain3.gain.linearRampToValueAtTime(0, ctx.currentTime + 2.8);
        osc3.connect(gain3).connect(ctx.destination);
        osc3.start(ctx.currentTime + 1.8);
        osc3.stop(ctx.currentTime + 3.0);

        // Layer 4: Sub-bass thud (reactor hit)
        const osc4 = ctx.createOscillator();
        const gain4 = ctx.createGain();
        osc4.type = 'sine';
        osc4.frequency.setValueAtTime(40, ctx.currentTime + 1.8);
        osc4.frequency.exponentialRampToValueAtTime(20, ctx.currentTime + 2.8);
        gain4.gain.setValueAtTime(0, ctx.currentTime + 1.8);
        gain4.gain.linearRampToValueAtTime(0.25, ctx.currentTime + 2.0);
        gain4.gain.linearRampToValueAtTime(0, ctx.currentTime + 3.0);
        osc4.connect(gain4).connect(ctx.destination);
        osc4.start(ctx.currentTime + 1.8);
        osc4.stop(ctx.currentTime + 3.0);

        // Layer 5: Filtered noise sweep
        const bufLen = ctx.sampleRate * 3;
        const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < bufLen; i++) data[i] = (Math.random() * 2 - 1) * 0.3;
        const noise = ctx.createBufferSource();
        noise.buffer = buf;
        const noiseGain = ctx.createGain();
        const lpf = ctx.createBiquadFilter();
        lpf.type = 'lowpass';
        lpf.frequency.setValueAtTime(100, ctx.currentTime);
        lpf.frequency.exponentialRampToValueAtTime(3000, ctx.currentTime + 2.0);
        lpf.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 3.0);
        noiseGain.gain.setValueAtTime(0, ctx.currentTime);
        noiseGain.gain.linearRampToValueAtTime(0.04, ctx.currentTime + 0.5);
        noiseGain.gain.linearRampToValueAtTime(0, ctx.currentTime + 3.0);
        noise.connect(lpf).connect(noiseGain).connect(ctx.destination);
        noise.start(ctx.currentTime);
        noise.stop(ctx.currentTime + 3.0);
      } catch (e) {
        console.warn('[ARC] Audio synthesis unavailable:', e);
      }

      // ── Fade out overlay after animation completes ───────────────────────
      setTimeout(() => {
        overlay.classList.add('fade-out');
        setTimeout(() => overlay.remove(), 1500);
      }, 4500);
    })();
  </script>
